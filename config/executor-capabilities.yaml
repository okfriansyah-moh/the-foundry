# Executor capability registry (docs/PLAN.md Task 84 / PRV-01, Task 142 / SEC-05).
#
# One record per executor adapter that exists in this repo. Routing
# (Task 85 ExecutorSelector) reads this via internal/executor/capability;
# it is NOT hardcoded in Go. Adding a provider or a capability string here
# needs no code change (Features is an open set — see §6.7 of
# docs/foundry/docs/providers/provider-execution-classes.md).
#
# availability: "supported" (working adapter, contract-suite green) or
#   "unsupported" (registry row kept for the decision trail, no adapter).
# sandbox_eligibility: sandbox_supported | host_only | unsupported (Task 142).
# last_verified_at: bump whenever you re-confirm a provider's capabilities
#   against the real CLI/API. Records older than 180d fail `make fitness`.
executors:
  - provider: claude-code
    execution_class: cli-agentic
    features:
      - reasoning.adaptive
      - tools.strict
      - context.prompt_cache
      - output.json
    availability: supported
    sandbox_eligibility: sandbox_supported
    profile_allow: []
    profile_deny: []
    requires_sandbox: true
    last_verified_at: 2026-08-02T00:00:00Z
