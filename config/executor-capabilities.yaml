    profile_deny: []
    last_verified_at: 2026-07-28T00:00:00Z
  # API-class providers (docs/PLAN.md Task 79 / EVO-06). No capability is
  # assumed — features are declared here, not inferred in code.
  - provider: openai
    execution_class: api
    features:
      - reasoning.adaptive
      - output.json
    availability: supported
    profile_allow: []
    profile_deny: []
    last_verified_at: 2026-07-28T00:00:00Z
  - provider: local
    execution_class: api
