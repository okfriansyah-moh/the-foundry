  # Kimi & Kilo: deliberately deferred (docs/PLAN.md Task 89 / PRV-06,
  # docs/notes/kimi-kilo-deferred.md). Registry rows kept for the decision
  # trail; availability: unsupported => never Eligible, never routed to, and
  # the kernel selector fails closed with "unsupported-executor" if named.
  # No adapter code exists for these.
  - provider: kimi
    execution_class: cli-agentic
