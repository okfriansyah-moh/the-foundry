services:
  foundry:
    image: ghcr.io/okfriansyah-moh/the-foundry:latest
    environment:
      PG_DSN: postgres://postgres:postgres@postgres:5432/foundry?sslmode=disable
      TEMPORAL_HOSTPORT: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foundry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foundry"]
      interval: 5s
      timeout: 5s
      retries: 12
  temporal:
    image: temporalio/auto-setup:1.27.0
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
