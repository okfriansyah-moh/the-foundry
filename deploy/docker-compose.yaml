services:
  dev:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
      args:
        USER_UID: "${USER_UID:-1000}"
        USER_GID: "${USER_GID:-1000}"
    volumes:
      - ..:/workspace
      - gomod-cache:/go/pkg/mod
      - gobuild-cache:/root/.cache/go-build
    working_dir: /workspace

volumes:
  gomod-cache:
  gobuild-cache:
