# Auto-provisioned Grafana datasource for the `obs` compose profile
# (docs/PLAN.md Task 31 / FND-12) — points at the `prometheus` service in
# ../../../docker-compose.yaml over the compose network, so no manual
# "Add data source" click is needed after `make up PROFILE=obs`.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
