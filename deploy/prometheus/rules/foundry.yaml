groups:
  - name: foundry.core
    rules:
      - alert: FoundryAutoAdmissionRateLow
        expr: auto_admission_rate < 0.9
        for: 10m
        labels: {severity: page}
        annotations:
          summary: auto admission rate below threshold
      - alert: FoundryAutoDeploymentRateLow
        expr: auto_deployment_rate < 0.8
        for: 10m
        labels: {severity: page}
        annotations:
          summary: auto deployment rate below threshold
      - alert: FoundryPromotionRollbackRateHigh
        expr: auto_promotion_rollback_rate > 0.2
        for: 5m
        labels: {severity: page}
        annotations:
          summary: rollback rate above threshold
      - alert: FoundryMissionTargetAttainmentLow
        expr: mission_target_attainment < 0.5
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: mission target attainment below threshold
      - alert: FoundryTimeToFirstRevenueHigh
        expr: time_to_first_revenue > 30
        for: 1h
        labels: {severity: ticket}
        annotations:
          summary: time to first revenue above threshold
