  <script src="../assets/app.js"></script>
  <script>
    (function () {
      const M = FoundryMock;
      const id = M.qs("id") || "apr-01";
      const a = M.approvals.find((x) => x.id === id) || M.approvals[0];

      document.getElementById("ceremony").innerHTML =
        "<h1>Secure approval</h1>" +
        '<div class="plan-id">' + a.detail + "</div>" +
        '<p class="muted">' + a.title + ' · <code class="mono">' + a.kind + "</code></p>" +
        '<div class="webauthn-box" id="webauthn-box">' +
        '<div class="icon">WA</div>' +
        "<div><strong>WebAuthn assertion</strong></div>" +
        '<p class="muted webauthn-status" style="margin:0.5rem 0 0;font-size:0.85rem">Touch security key or platform authenticator</p>' +
        '<button class="btn btn-primary" style="margin-top:1rem" data-action="webauthn">Assert credential (mock)</button>' +
        "</div>" +
        '<div class="row" style="justify-content:flex-end">' +
        '<a class="btn btn-ghost" href="approvals.html">Cancel</a>' +
        '<button class="btn btn-danger" data-action="reject-plan">Reject</button>' +
        '<button class="btn btn-primary" id="approve-submit" disabled data-action="approve-plan">Record approval</button>' +
        "</div>" +
        '<p class="authority-note">Mirrors POST approve with WebAuthn. This mock never calls the API. Telegram /approve is reply-only and never executes high-risk approval.</p>';
    })();
  </script>
